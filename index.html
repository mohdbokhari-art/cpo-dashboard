<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard CPO</title>
<style>
  :root { --bg:#050b1a; --card:#0b1426; --line:#16304a; --text:#e5eefc; --muted:#7c8fa8; --cyan:#22d3ee; --pink:#f43f8e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:radial-gradient(circle at 20% 0%, #0b1f3a 0%, var(--bg) 55%); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:100%; max-width:680px; }
  h1 { font-family:Consolas,"Courier New",monospace; letter-spacing:.12em; text-transform:uppercase;
       font-size:1.3rem; color:var(--cyan); margin:0 0 6px; }
  p.sub { font-family:Consolas,monospace; letter-spacing:.1em; font-size:.75rem; color:var(--muted);
          margin:0 0 28px; text-transform:uppercase; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:22px; text-decoration:none; color:inherit; transition:all .15s; }
  a.card:hover { border-color:var(--cyan); box-shadow:0 0 18px rgba(34,211,238,.25); transform:translateY(-2px); }
  a.card h2 { margin:0 0 8px; font-family:Consolas,monospace; letter-spacing:.1em; text-transform:uppercase;
              font-size:1rem; color:var(--cyan); }
  a.card.alt:hover { border-color:var(--pink); box-shadow:0 0 18px rgba(244,63,142,.25); }
  a.card.alt h2 { color:var(--pink); }
  a.card.third:hover { border-color:#a5a0f0; box-shadow:0 0 18px rgba(165,160,240,.25); }
  a.card.third h2 { color:#a5a0f0; }
  a.card span { color:var(--muted); font-size:.88rem; }
</style>
</head>
<body>
<main>
  <h1>Dashboard CPO</h1>
  <p class="sub">Bahagian Penguatkuasaan Farmasi · KKM</p>
  <div class="grid">
    <a class="card" href="statistik/">
      <h2>📊 Statistik</h2>
      <span>Rampasan dan serbuan</span>
    </a>
    <a class="card alt" href="pembatalan/">
      <h2>📋 Pembatalan</h2>
      <span>Carian pembatalan notifikasi</span>
    </a>
    <a class="card third" href="pengkelasan/">
      <h2>🗂️ Pengkelasan</h2>
      <span>Carian keputusan pengkelasan</span>
    </a>
  </div>
</main>
</body>
</html>
